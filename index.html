<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connect Better</title>
  <meta name="description" content="Conversation starters for the people in your life, from light icebreakers to questions that build real connection.">
  <meta name="theme-color" content="#FAF6EF">

  <!-- Lets people add the app to their phone's home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Connect Better">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar" id="topbar"></header>
    <!-- app.js draws each screen inside this element -->
    <main class="view" id="app" tabindex="-1"></main>
  </div>

  <noscript>
    <p class="noscript">Connect Better needs JavaScript to run. Please enable it in your browser settings.</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
